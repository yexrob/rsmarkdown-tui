[workspace]
resolver = "2"
members = ["crates/core", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/rsmarkdown-tui"

[workspace.dependencies]
pulldown-cmark = "0.13"
unicode-width = "0.2"
memchr = "2"

[profile.release]
lto = true
