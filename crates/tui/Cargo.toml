[package]
name = "rsmarkdown-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TUI display-layer adapter for rsmarkdown-core"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "chat"
harness = false

[dependencies]
rsmarkdown-core = { path = "../core" }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = { workspace = true }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
